
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessDock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ChessDock</h1>

  <div class="game-container">

    <p id="connection-status">Connexion au serveur en cours…</p>

    <section id="lobby">
      <h2>Jouer aux échecs</h2>
      <p>Crée une partie et partage son code avec ton adversaire.</p>

      <button id="create-game-btn" type="button" disabled>
        Créer une partie
      </button>

      <p id="game-message" role="status" aria-live="polite">
        En attente de connexion au serveur…
      </p>

      <div id="game-code-container" hidden>
        <p>Code de ta partie :</p>
        <strong id="game-code"></strong>
        <button id="copy-code-btn" type="button">
          Copier le code
        </button>
      </div>
    </section>

    <div id="board"></div>

  </div>

  <script src="script.js"></script>
  <script src="websocket.js"></script>
  <script src="client.js"></script>

</body>
</html>
