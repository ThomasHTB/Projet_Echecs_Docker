# ============================================================
#  Nginx = point d'entrée UNIQUE de l'application.
#  - sert les fichiers du front (HTML / CSS / JS / SVG)
#  - relaie /api/ et /ws vers le conteneur backend (reverse proxy)
#  "backend" est résolu par le DNS interne de Docker (nom du service compose).
# ============================================================
server {
    listen 8080;
    server_tokens off;                        # cache la version de Nginx

    # En-têtes de sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 16k;                 # l'appli n'envoie jamais de gros fichiers

    # DNS interne de Docker. En passant l'adresse du backend par une variable,
    # Nginx la redemande régulièrement : si le conteneur backend est recréé
    # (nouvelle IP), Nginx le retrouve sans avoir besoin d'être redémarré.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers du front
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST -> backend
    location /api/ {
        proxy_pass $backend_url;
        proxy_set_header Host $http_host;     # $http_host garde le port (utile au contrôle d'origine)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket -> backend
    location /ws {
        proxy_pass $backend_url;
        proxy_http_version 1.1;               # obligatoire pour le WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;     # le backend compare Origin et Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;             # garde la connexion ouverte pendant la partie
    }
}
