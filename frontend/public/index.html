<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Échecs en ligne</title>
</head>
<body>
  <!-- PLACEHOLDER : à remplacer par le front de Thomas -->
  <h1>Échecs en ligne</h1>
  <p>Backend : <strong id="backend">…</strong></p>
  <p>Base de données : <strong id="db">…</strong></p>
  <script>
    fetch("/api/health")
      .then(r => r.json())
      .then(d => {
        document.getElementById("backend").textContent = d.backend;
        document.getElementById("db").textContent = d.db;
      })
      .catch(() => document.getElementById("backend").textContent = "injoignable");
  </script>
</body>
</html>
