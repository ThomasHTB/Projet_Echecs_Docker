services:
  # ---------- Base de données ----------
  db:
    image: postgres:16-alpine          # image officielle, version figée, légère
    restart: unless-stopped            # redémarre si ça plante, sauf arrêt manuel
    environment:                       # valeurs lues dans le .env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # données persistantes
    healthcheck:                       # "la base est-elle prête ?"
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - back-net                       # réseau interne uniquement, aucun port exposé

  # ---------- Backend (FastAPI : API + WebSocket) ----------
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy     # attend que Postgres soit prêt
    networks:                          # aucun port exposé : on passe par Nginx
      - front-net
      - back-net

  # ---------- Frontend (Nginx : fichiers statiques + reverse proxy) ----------
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:8080"        # SEUL port ouvert sur la machine
    depends_on:
      - backend
    networks:
      - front-net

networks:
  front-net:
  back-net:
    internal: true                     # pas d'accès depuis l'extérieur

volumes:
  pgdata:                              # volume nommé géré par Docker
